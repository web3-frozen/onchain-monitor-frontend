name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:
  ci:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: onchain-monitor-frontend
      image-name: onchain-monitor-frontend
      workload-dir: workloads/onchain-monitor
      node-version: "22"
    secrets: inherit

  # ── Integration Test ─────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'homelab-onchain-monitor-frontend' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start local PostgreSQL and Redis
        run: |
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/initdb" ]] || ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 redis-server
            sudo systemctl stop postgresql redis-server
          fi
          pg_data="$RUNNER_TEMP/postgres"
          "$pg_bin/initdb" -D "$pg_data" -U test -A trust --no-locale
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/postgres.log" \
            -o "-h 127.0.0.1 -k $RUNNER_TEMP" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -U test onchain_monitor_test
          redis-server --bind 127.0.0.1 --save '' --appendonly no --daemonize yes \
            --pidfile "$RUNNER_TEMP/redis.pid" --logfile "$RUNNER_TEMP/redis.log"
          redis-cli ping | grep -x PONG

      # ── Build & start backend ──────────────────────────
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: web3-frozen/onchain-monitor
          path: backend

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum

      - name: Build backend
        run: cd backend && go build -o server ./cmd/server

      - name: Start backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/onchain_monitor_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          TELEGRAM_BOT_TOKEN: "0000000000:fake-token-for-integration-test"
          PORT: "8080"
          FRONTEND_ORIGIN: "*"
        run: |
          cd backend && ./server &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done

      # ── Build & start frontend ─────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Start frontend
        run: |
          npm start &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            sleep 1
          done

      # ── Verify ─────────────────────────────────────────
      - name: Verify frontend renders
        run: |
          echo "=== Page loads ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          echo "=== Page contains app shell ==="
          curl -s http://localhost:3000 | grep -q "Onchain Monitor" && echo "✓ Title found" || exit 1

      - name: Verify API connectivity
        run: |
          echo "=== Backend health ==="
          curl -sf http://localhost:8080/healthz | jq .

          echo "=== Events from backend ==="
          curl -sf http://localhost:8080/api/events | jq 'length'

          echo "=== Stats from backend ==="
          curl -sf http://localhost:8080/api/stats | jq 'length'

      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/frontend.pid ] && kill $(cat /tmp/frontend.pid) 2>/dev/null || true
          [ -f /tmp/server.pid ] && kill $(cat /tmp/server.pid) 2>/dev/null || true
