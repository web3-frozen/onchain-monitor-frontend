name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:
  ci:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: onchain-monitor-frontend
      image-name: onchain-monitor-frontend
      workload-dir: workloads/onchain-monitor
      node-version: "22"
    secrets: inherit

  # ── Integration Test ─────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: onchain_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d onchain_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      # ── Build & start backend ──────────────────────────
      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: web3-frozen/onchain-monitor
          path: backend

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Build backend
        run: cd backend && go build -o server ./cmd/server

      - name: Start backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/onchain_monitor_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          TELEGRAM_BOT_TOKEN: "0000000000:fake-token-for-integration-test"
          PORT: "8080"
          FRONTEND_ORIGIN: "*"
        run: |
          cd backend && ./server &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done

      # ── Build & start frontend ─────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Start frontend
        run: |
          npm start &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            sleep 1
          done

      # ── Verify ─────────────────────────────────────────
      - name: Verify frontend renders
        run: |
          echo "=== Page loads ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          echo "=== Page contains app shell ==="
          curl -s http://localhost:3000 | grep -q "Onchain Monitor" && echo "✓ Title found" || exit 1

      - name: Verify API connectivity
        run: |
          echo "=== Backend health ==="
          curl -sf http://localhost:8080/healthz | jq .

          echo "=== Events from backend ==="
          curl -sf http://localhost:8080/api/events | jq 'length'

          echo "=== Stats from backend ==="
          curl -sf http://localhost:8080/api/stats | jq 'length'

      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/frontend.pid ] && kill $(cat /tmp/frontend.pid) 2>/dev/null || true
          [ -f /tmp/server.pid ] && kill $(cat /tmp/server.pid) 2>/dev/null || true
